; =============================================================================
;  Monitor de pulso cardíaco y oxímetro MAX30100
;  Gráfico estilo ECG en pantalla OLED redonda GC9A01 (1.28" 240x240)
;  Microcontrolador: ESP32 DevKit (framework Arduino)
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; Librerías del proyecto:
;  - MAX30100lib: driver + algoritmo de pulso/oximetría para el MAX30100
;  - Arduino_GFX:  soporte nativo de la pantalla GC9A01 (SPI) sin editar
;                  archivos de configuración
lib_deps =
    oxullo/MAX30100lib
    moononournation/GFX Library for Arduino @ 1.4.7

build_flags =
    -DCORE_DEBUG_LEVEL=0
